name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        workspace:
          - "@schedule-app/shared"
          - "@schedule-app/crypto"
          - "@schedule-app/api"
          - "@schedule-app/web"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduleapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scheduleapp_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --workspace=${{ matrix.workspace }}

      - name: Test
        run: npm run test --workspace=${{ matrix.workspace }}

  rust:
    runs-on: ubuntu-latest
    # The API tests run against a real Postgres, as the TS suite's do.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduleapp_rust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CARGO_TERM_COLOR: always
      RUST_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scheduleapp_rust_test
    steps:
      - uses: actions/checkout@v4

      # Installs exactly the toolchain, components and wasm target pinned
      # in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # mekur-shared and mekur-crypto are also compiled into the browser
      # client.
      - name: Clippy (client, shared and crypto, wasm32)
        run: cargo clippy -p mekur-client -p mekur-shared -p mekur-crypto --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build client for the browser (wasm32)
        run: cargo build -p mekur-client -p mekur-crypto --target wasm32-unknown-unknown --locked

  build-docker-images:
    runs-on: ubuntu-latest
    needs: [test, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: docker build -f infra/Dockerfile.api -t schedule-app-api:ci .

      - name: Build Rust api image
        run: docker build -f infra/Dockerfile.api-rs -t schedule-app-api-rs:ci .

      - name: Check the nginx config
        run: >-
          docker run --rm
          --add-host api:127.0.0.1 --add-host api-rs:127.0.0.1
          -v "$PWD/infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t

      - name: Build web image
        run: docker build -f infra/Dockerfile.web -t schedule-app-web:ci .
