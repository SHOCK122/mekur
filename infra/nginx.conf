# Service worker and manifest must never be cached long-term, or clients
# will get stuck on stale app versions. Chosen by map rather than an
# add_header inside a location block: nginx drops every inherited
# add_header in a location that declares its own, which would silently
# strip the security headers below from exactly those files.
map $uri $cache_control {
    /sw.js                "no-cache";
    /manifest.webmanifest "no-cache";
    default               "";
}

# The API is being ported from TypeScript to Rust one route group at a
# time (docs/RUST_MIGRATION.md). The Rust server (api-rs) gets the paths
# ported so far, listed below; the list grows with each slice until it
# serves everything.
upstream api_rs { server api-rs:3000; }

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # An empty value means the header isn't sent.
    add_header Cache-Control $cache_control;

    # Security headers for the app itself. The API sets its own via helmet,
    # but the page is what holds the decrypted schedule and the locally
    # stored keys, so the page is what XSS and framing must be kept out of.
    # The built app has no inline scripts; inline *styles* are needed for
    # React's style attributes (timeline positions).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse proxy API calls (see docker-compose.yml). Set at server level
    # so every API location below inherits the same settings.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Ported to Rust (query strings are passed through).
    location = /api/health       { proxy_pass http://api_rs/health; }
    location = /api/openapi.json { proxy_pass http://api_rs/openapi.json; }
    location = /api/users        { proxy_pass http://api_rs/users; }
    location = /api/sessions     { proxy_pass http://api_rs/sessions; }
    location = /api/api-keys     { proxy_pass http://api_rs/api-keys; }
    # Paths with parameters: a regex location (checked before the /api/
    # prefix below) that strips /api and passes the rest on unchanged.
    location ~ ^/api/users/[^/]+/salt$ { rewrite ^/api(/.*)$ $1 break; proxy_pass http://api_rs; }
    # An empty id (`/api/api-keys/`) goes to Rust too: the TS route took it.
    location ~ ^/api/api-keys/[^/]*$ { rewrite ^/api(/.*)$ $1 break; proxy_pass http://api_rs; }

    # Everything else: the TS server.
    location /api/ {
        proxy_pass http://api:3000/;
    }

    # SPA fallback: any unmatched route serves index.html so client-side
    # routing works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
