# Service worker and manifest must never be cached long-term, or clients
# will get stuck on stale app versions. Chosen by map rather than an
# add_header inside a location block: nginx drops every inherited
# add_header in a location that declares its own, which would silently
# strip the security headers below from exactly those files.
map $uri $cache_control {
    /sw.js                "no-cache";
    /manifest.webmanifest "no-cache";
    default               "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # An empty value means the header isn't sent.
    add_header Cache-Control $cache_control;

    # Security headers for the app itself. The API sets its own via helmet,
    # but the page is what holds the decrypted schedule and the locally
    # stored keys, so the page is what XSS and framing must be kept out of.
    # The built app has no inline scripts; inline *styles* are needed for
    # React's style attributes (timeline positions).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse proxy API calls to the api service (see docker-compose.yml).
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: any unmatched route serves index.html so client-side
    # routing works on refresh/deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
