[package]
name = "mekur-api"
description = "HTTP API server (replaces apps/api)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mekur-shared = { path = "../shared" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
getrandom = "0.4.3"
hmac = "0.13.0"
http-body-util = "0.1.5"
# HS256 only; `rust_crypto` is the RustCrypto backend (no C toolchain).
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
lru = "0.19.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "derive"] }
subtle = "2.6.1"
thiserror = "2"
uuid = "1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "io-util", "time"] }

[dev-dependencies]
# Tests only: to derive real keys and seal envelopes as a client would. The
# server itself never links the client cryptography.
mekur-crypto = { path = "../crypto" }
futures-core = "0.3.34"
tower = { version = "0.5.3", features = ["util"] }

[lints]
workspace = true
